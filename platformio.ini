; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; pioarduino ships arduino-esp32 3.3.x, which is needed for the ESP32-C5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32c5
board_build.filesystem = spiffs
build_flags =
	-DASYNCWEBSERVER_REGEX
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
monitor_speed = 115200
monitor_filters =
lib_deps =
	waspinator/AccelStepper@^1.64
	madhephaestus/ESP32Servo@^3.2.1
	alanswx/ESPAsyncWiFiManager@^0.31
	olikraus/U8g2@^2.36.18
	ricmoo/QRCode@^0.0.1
	bblanchon/ArduinoJson@^6.21.6
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1
	ayushsharma82/ElegantOTA@^3.1.7
lib_ignore =
	AsyncTCP_RP2040W
	ESP Async WebServer

[env:serial-upload]
upload_protocol = esptool

[env:ota-upload]
extra_scripts = src/ota/upload.py
upload_protocol = custom
upload_url = http://e-tkt.local
